server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        http:
          endpoint: 0.0.0.0:4318

storage:
  trace:
    backend: local
    local:
      path: /tmp/tempo/traces
    wal:
      path: /tmp/tempo/wal
    block:
      # Store dashboard filter attributes in dedicated Parquet columns so a
      # TraceQL search reads those columns instead of decoding all generic
      # attributes. Tempo 2.6 supports string columns only.
      parquet_dedicated_columns:
        - name: project
          type: string
          scope: resource
        - name: experiment_name
          type: string
          scope: resource
        - name: replica
          type: string
          scope: resource
        - name: sample
          type: string
          scope: span
