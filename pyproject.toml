[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rl-insight"
version = "0.3.0"
description = "Performance insight tools for reinforcement learning frameworks."
readme = "README.md"
requires-python = ">=3.9"
authors = [
  { name = "rl-insight contributors", email = "huxiaobo@zju.edu.cn" },
]
dependencies = [
  "ray",
  "omegaconf",
  "fastapi",
  "uvicorn",
  "requests",
  "prometheus_client",
  "opentelemetry-sdk",
  "opentelemetry-exporter-otlp-proto-http",
  "pyyaml",
  "psutil",
  # In-process Jsonnet evaluator used by rl_insight.grafana.renderer. rjsonnet
  # publishes CPython ABI3 wheels for Windows, macOS and Linux, so no Jsonnet
  # CLI, Go toolchain or compiler is required at install time.
  "rjsonnet>=0.5.6",
]

[project.optional-dependencies]
recipe = [
  "numpy",
  "pandas",
  "plotly",
  "matplotlib",
  "loguru",
  "kaleido",
  "torch",
  "ijson",
]
test = [
  "pytest",
]

[project.scripts]
rl-insight = "rl_insight.cli:main"
rl-insight-recipe = "recipe:main"

[project.urls]
Homepage = "https://github.com/verl-project/rl-insight"
Source = "https://github.com/verl-project/rl-insight"

[tool.setuptools.packages.find]
where = ["."]
include = ["rl_insight", "rl_insight.*", "recipe", "recipe.*"]

[tool.setuptools.package-data]
rl_insight = [
  "config/*.yaml",
  "config/*.yml",
  "config/services/prometheus/*.yml",
  "config/services/prometheus/*.yaml",
  "config/services/tempo/*.yml",
  "config/services/tempo/*.yaml",
  "config/services/grafana/*.ini",
  "config/services/grafana/provisioning/datasources/*.yml",
  "config/services/grafana/provisioning/dashboards/*.yml",
  "config/services/grafana/dashboards/*.json",
  "config/services/grafana/dashboards/*/*.json",
  "config/services/grafana/jsonnet/framework/*.libsonnet",
]
recipe = [
  "config/*.yaml",
  "config/*.yml",
]

[tool.pytest.ini_options]
pythonpath = ["."]
